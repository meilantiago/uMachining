[metadata]
name = umachining
version = attr: umachining.__version__
description = Interfaz de PC y firmware del eje lineal de micromaquinado μMachining (Raspberry Pi Pico)
long_description = file: README.md
long_description_content_type = text/markdown
author = Francisco Maresca, Tiago Meilán
url = https://github.com/meilantiago/uMachining

[options]
packages = umachining, umachining.firmware
python_requires = >=3.8
install_requires =
    numpy>=1.20
    matplotlib>=3.3
    pyserial>=3.4
    PyQt5>=5.15
    pyqtgraph>=0.12
    pyvisa>=1.11
    pyvisa-py>=0.5

[options.package_data]
umachining.firmware = firmware.uf2, SHA256SUMS, INFO.txt

[options.entry_points]
console_scripts =
    umachining = umachining.interfaz:main
    umachining-gcode = umachining.send_gcode:main
    umachining-flashear = umachining.flashear:main
