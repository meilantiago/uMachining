; PlatformIO project configuration
; Adapted from MicroManipulatorStepper/firmware/MotionControllerRP

; On Linux the PlatformIO udev rules must be installed before uploading:
;  sudo curl -fsSL https://raw.githubusercontent.com/platformio/platformio-core/develop/platformio/assets/system/99-platformio-udev.rules -o /etc/udev/rules.d/99-platformio-udev.rules
;  sudo systemctl restart systemd-udevd
;  then replug the board.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico          ; RP2040 (Raspberry Pi Pico)
;board = rpipico2        ; RP2350 (Pico 2), untested
board_build.filesystem_size = 0.5m

framework = arduino
build_flags =
    -Wl,-u,_printf_float

lib_deps =
    littlefs
monitor_speed = 921600
monitor_echo = yes
monitor_filters = send_on_enter
