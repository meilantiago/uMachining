name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-rp2040
          path: |
            .pio/build/pico/firmware.uf2
            .pio/build/pico/firmware.bin

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python tools compile
        run: python3 -m py_compile tools/*.py
